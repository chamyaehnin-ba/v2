<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCMS Local Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, Arial, sans-serif; background: #f4f7fb; color: #17202a; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(0,91,150,.06), rgba(15,139,141,.04) 42%, rgba(180,35,24,.035)); }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 292px; background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%); border-right: 1px solid #d9e2ec; overflow: auto; box-shadow: 8px 0 28px rgba(15,23,42,.05); }
    .brand { height: 76px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #d9e2ec; }
    .logo { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #005b96, #0f8b8d); color: #fff; display: grid; place-items: center; font-weight: 850; box-shadow: 0 8px 18px rgba(0,91,150,.24); }
    .brand strong { display: block; }
    .brand span, .muted { color: #64748b; font-size: 12px; }
    .nav { padding: 16px 12px 28px; }
    .section { margin: 18px 0 8px; padding: 0 10px; color: #64748b; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .nav button { width: 100%; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #334155; padding: 10px 12px; margin: 3px 0; text-align: left; cursor: pointer; font-weight: 680; transition: .16s ease; }
    .nav button::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: #94a3b8; }
    .nav .label { flex: 1; min-width: 0; }
    .count { min-width: 26px; border-radius: 999px; background: #e2e8f0; color: #334155; padding: 2px 7px; text-align: center; font-size: 11px; font-weight: 850; }
    .active .count { background: rgba(255,255,255,.2); color: #fff; }
    .nav button:hover { background: #eef4fb; border-color: #d8e6f4; transform: translateX(2px); }
    .nav button.active { background: #005b96; color: #fff; box-shadow: 0 8px 20px rgba(0,91,150,.18); }
    .nav button.active::before { background: #fff; }
    main { margin-left: 292px; min-height: 100vh; position: relative; }
    header { height: 76px; position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid #d9e2ec; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
    h1, h2, h3, p { margin: 0; }
    .eyebrow { color: #005b96; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .content { padding: 26px; }
    select, input { border: 1px solid #cbd5e1; border-radius: 6px; padding: 9px 11px; background: #fff; color: #17202a; }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; padding: 9px 13px; font-weight: 750; cursor: pointer; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .btn.primary { background: #005b96; color: #fff; border-color: #005b96; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .panel { background: rgba(255,255,255,.96); border: 1px solid #d9e2ec; border-radius: 10px; box-shadow: 0 10px 24px rgba(15,23,42,.06); }
    .metric { padding: 18px; }
    .metric-top { display: flex; justify-content: space-between; color: #475569; font-weight: 750; }
    .metric-value { margin-top: 18px; font-size: 34px; font-weight: 850; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th { background: #f8fafc; color: #64748b; text-align: left; font-size: 12px; padding: 13px 14px; text-transform: uppercase; }
    td { padding: 13px 14px; border-top: 1px solid #edf2f7; font-size: 14px; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .table-wrap { overflow: auto; border-radius: 10px; border: 1px solid #d9e2ec; box-shadow: 0 10px 24px rgba(15,23,42,.06); }
    .badge { display: inline-flex; border-radius: 5px; padding: 5px 8px; font-size: 12px; font-weight: 800; }
    .HUB { background: #e8f2ff; color: #005b96; }
    .INBOX, .READY_TO_ISSUE { background: #e6fffb; color: #0f766e; }
    .INCOMPLETE, .INSUFFICIENT { background: #fff7ed; color: #b45309; }
    .REJECTED { background: #fff1f2; color: #b42318; }
    .PRE_APPROVED { background: #eef2ff; color: #4338ca; }
    .APPROVED { background: #ecfdf3; color: #067647; }
    .COMPLETED { background: #f1f5f9; color: #475569; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 750; color: #334155; }
    label input, label select { width: 100%; }
    .actions { display: flex; gap: 8px; }
    .actions button { border: 0; border-radius: 5px; background: #005b96; color: #fff; padding: 7px 9px; font-weight: 750; cursor: pointer; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .hero { position: relative; overflow: hidden; border-radius: 12px; background: linear-gradient(135deg, #083b64 0%, #005b96 42%, #0f8b8d 100%); color: #fff; padding: 22px 24px; margin-bottom: 18px; box-shadow: 0 14px 32px rgba(0,91,150,.2); }
    .hero::after { content: ""; position: absolute; right: 22px; top: 18px; width: 190px; height: 104px; border: 1px solid rgba(255,255,255,.22); border-radius: 12px; transform: rotate(-6deg); background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); }
    .hero h2 { font-size: 24px; }
    .hero p { color: rgba(255,255,255,.82); margin-top: 6px; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0 18px; }
    .kpi { border: 1px solid #d9e2ec; border-radius: 10px; background: rgba(255,255,255,.96); padding: 13px 14px; box-shadow: 0 6px 16px rgba(15,23,42,.05); }
    .kpi span { color: #64748b; font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; }
    .kpi strong { display: block; margin-top: 8px; font-size: 22px; }
    .accent-bank { border-left: 4px solid #005b96; }
    .accent-mint { border-left: 4px solid #0f8b8d; }
    .accent-warn { border-left: 4px solid #b7791f; }
    .accent-risk { border-left: 4px solid #b42318; }
    @media (max-width: 980px) { .sidebar { width: 248px; } main { margin-left: 248px; } .grid, .form-grid, .split { grid-template-columns: 1fr; } .toolbar { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">CC</div>
      <div><strong>CCMS</strong><span>KBZ Banking Operations</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <header>
      <div>
        <div class="eyebrow">Centralized Credit Card Management System</div>
        <h1>Credit Card Operations Portal</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <select id="role">
          <option value="SUPER">Super User</option>
          <option value="OPERATOR">Operator User</option>
          <option value="BRANCH">Branch User</option>
        </select>
        <div style="text-align:right"><strong id="userName">Super User</strong><div class="muted" id="userMeta">SUPER</div></div>
      </div>
    </header>
    <section class="content" id="app"></section>
  </main>
  <script>
    const firstPage = { SUPER: "hub", OPERATOR: "inbox", BRANCH: "create-new-application" };
    const state = { role: "SUPER", page: "hub" };
    const apps = [
      ["277CC260525001", "Mg Mg Aung", "12/LaKaNa(N)123456", 5000000, 0, "SUPER", "HUB", 0, "SSBP", "New", "277", "2026-05-25 09:10"],
      ["277CC260525002", "Ma Hnin Yu", "10/MaLaMa(N)654321", 2000000, 0, "SUPER", "HUB", 0, "BRANCH", "New", "277", "2026-05-25 09:25"],
      ["C101CC260525003", "Ko Zaw Lin", "9/MaHtaLa(N)456789", 3000000, 0, "SUPER", "HUB", 1, "KBZPAY_CENTRE", "New", "C101", "2026-05-25 10:05"],
      ["277CC260525004", "Daw May", "8/PaKhaKa(N)222111", 200000, 0, "OPERATOR", "INBOX", 0, "BRANCH", "New", "277", "2026-05-25 10:30"],
      ["277CC260525005", "U Kyaw", "6/KaSaNa(N)778899", 500000, 0, "OPERATOR", "INBOX", 0, "SSBP", "New", "277", "2026-05-25 11:20"],
      ["C101CC260525006", "Ma Thandar", "12/ThaKaTa(N)987654", 700000, 0, "OPERATOR", "INBOX", 1, "BRANCH", "New", "C101", "2026-05-25 11:45"],
      ["277CC260525007", "Ko Aung", "14/PaThaNa(N)123123", 1000000, 1000000, "SUPER", "PRE_APPROVED", 0, "SSBP", "New", "277", "2026-05-25 12:00"],
      ["277CC260525008", "Ma Su", "5/SaKaNa(N)321321", 2000000, 2000000, "SUPER", "PRE_APPROVED", 0, "BRANCH", "New", "277", "2026-05-25 12:15"],
      ["277CC260525009", "U Min Thu", "7/YaTaNa(N)654987", 3500000, 3500000, "BRANCH", "APPROVED", 0, "SSBP", "New", "277", "2026-05-25 13:20"],
      ["C101CC260525010", "Daw Khin Mar", "13/TaKaNa(N)147258", 2500000, 2500000, "BRANCH", "APPROVED", 0, "KBZPAY_CENTRE", "New", "C101", "2026-05-25 13:50"],
      ["277CC260525011", "Ko Hein", "11/SaTaNa(N)369258", 800000, 0, "OPERATOR", "INSUFFICIENT", 2, "SSBP", "New", "277", "2026-05-25 14:05"],
      ["277CC260525012", "Ma Nwe", "3/BaAhNa(N)741852", 1200000, 0, "SUPER", "INSUFFICIENT", 1, "BRANCH", "New", "277", "2026-05-25 14:30"],
      ["C101CC260525013", "U Thet", "4/HaKhaNa(N)963852", 200000, 0, "OPERATOR", "INCOMPLETE", 1, "BRANCH", "New", "C101", "2026-05-25 15:10"],
      ["277CC260525014", "Ma Ei Mon", "2/LaKaNa(N)852741", 650000, 0, "SUPER", "INCOMPLETE", 3, "SSBP", "New", "277", "2026-05-25 15:25"],
      ["277CC260525015", "Ko Nay", "1/MaKaNa(N)159357", 900000, 0, "OPERATOR", "REJECTED", 0, "SSBP", "New", "277", "2026-05-25 16:00"],
      ["C101CC260525016", "Daw San", "15/MaMaNa(N)753951", 2200000, 0, "SUPER", "REJECTED", 0, "BRANCH", "New", "C101", "2026-05-25 16:35"],
      ["277CC260525017", "Ma Phyu", "12/DaGaNa(N)246810", 1600000, 1600000, "BRANCH", "READY_TO_ISSUE", 0, "SSBP", "New", "277", "2026-05-25 17:00"],
      ["277CC260525018", "Ko Lin Htet", "9/PaBaNa(N)112233", 5000000, 5000000, "BRANCH", "READY_TO_ISSUE", 0, "BRANCH", "New", "277", "2026-05-25 17:25"],
      ["C101CC260525019", "U Win", "8/MaBaNa(N)445566", 750000, 750000, "BRANCH", "COMPLETED", 0, "SSBP", "New", "C101", "2026-05-25 18:10"],
      ["277CC260525020", "Ma Cherry", "6/ThaYaNa(N)778800", 2800000, 2800000, "BRANCH", "COMPLETED", 1, "BRANCH", "New", "277", "2026-05-25 18:45"],
      ["277CC260525021", "Ko Sithu", "5/KaLaNa(N)998877", 400000, 400000, "BRANCH", "COMPLETED", 0, "SSBP", "New", "277", "2026-05-25 19:00"],
      ["277CC260524022", "Ma Wai Wai", "12/KaMaYa(N)101010", 900000, 0, "SUPER", "HUB", 0, "SSBP", "New", "277", "2026-05-24 15:00"],
      ["277CC260524023", "Ko Phone", "7/PaKhaNa(N)202020", 1400000, 1400000, "BRANCH", "COMPLETED", 0, "BRANCH", "New", "277", "2026-05-24 16:30"]
    ];
    const today = "2026-05-25";
    const menus = {
      SUPER: [["Application Management", ["Hub","Inbox","Approved","Rejected","Insufficient","Incomplete","Ready To Issue","Complete"]], ["Report", ["Daily Report","User Progress Report"]]],
      OPERATOR: [["Application Management", ["Inbox","Submit","Rejected","Insufficient","Incomplete","Ready To Issue","Complete"]], ["Report", ["Daily Report","User Progress Report"]]],
      BRANCH: [["Application Management", ["Create New Application","Submit","Rejected","Insufficient","Incomplete","Ready To Issue","Complete"]], ["Report", ["Daily Report","User Progress Report"]]]
    };
    const pageToStatus = {
      "Hub":"HUB", "Inbox":"INBOX", "Submit":"PRE_APPROVED", "Approved":"APPROVED", "Rejected":"REJECTED",
      "Insufficient":"INSUFFICIENT", "Incomplete":"INCOMPLETE", "Ready To Issue":"READY_TO_ISSUE", "Complete":"COMPLETED"
    };
    function menuCount(item) {
      if (item === "Create New Application") return "";
      if (item === "Daily Report" || item === "User Progress Report") return "";
      const status = pageToStatus[item];
      return status ? apps.filter(a => a[6] === status && a[11].startsWith(today)).length : "";
    }
    function slug(x){ return x.toLowerCase().replaceAll(" ","-"); }
    function setPage(page){ state.page = page; render(); }
    function renderNav(){
      const nav = document.getElementById("nav");
      nav.innerHTML = "";
      for (const [section, items] of menus[state.role]) {
        nav.innerHTML += `<div class="section">${section}</div>`;
        for (const item of items) {
          const count = menuCount(item);
          nav.innerHTML += `<button class="${state.page===slug(item)?"active":""}" onclick="setPage('${slug(item)}')"><span class="label">${item}</span>${count === "" ? "" : `<span class="count">${count}</span>`}</button>`;
        }
      }
    }
    function queue(title){
      const status = pageToStatus[title] || "HUB";
      const rows = apps.filter(a => a[6] === status && a[11].startsWith(today));
      const totalToday = apps.filter(a => a[11].startsWith(today)).length;
      const pendingToday = apps.filter(a => ["HUB","INBOX","PRE_APPROVED"].includes(a[6]) && a[11].startsWith(today)).length;
      const attentionToday = apps.filter(a => ["INCOMPLETE","INSUFFICIENT","REJECTED"].includes(a[6]) && a[11].startsWith(today)).length;
      return `<section class="hero"><h2>${status.replaceAll("_"," ")} Queue</h2><p>${state.role.toLowerCase()} workspace for today's credit card application processing.</p></section>
      <div class="kpis"><div class="kpi accent-bank"><span>This Queue</span><strong>${rows.length}</strong></div><div class="kpi accent-mint"><span>Today Total</span><strong>${totalToday}</strong></div><div class="kpi accent-warn"><span>Pending Review</span><strong>${pendingToday}</strong></div><div class="kpi accent-risk"><span>Need Attention</span><strong>${attentionToday}</strong></div></div>
      <div class="toolbar"><div><h2>Application Listing</h2><p class="muted">Showing applications available for ${state.role.toLowerCase()} workflow operations.</p></div><div class="filters"><input placeholder="Search Doc No / NRC"><button class="btn">Advanced Filter</button><button class="btn">Export Excel</button></div></div>
      <div class="table-wrap"><table><thead><tr>${["No","Document No","Applicant Name","NRC","Credit Limit","Approved Amount","Stage","Status","Loop","Channel","Type","Action"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.map((a,i)=>`<tr><td>${i+1}</td><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3].toLocaleString()} MMK</td><td>${a[4]?a[4].toLocaleString()+" MMK":"-"}</td><td>${a[5]}</td><td><span class="badge ${a[6]}">${a[6].replaceAll("_"," ")}</span></td><td>${a[7]}</td><td>${a[8]}</td><td>${a[9]}</td><td><div class="actions">${actions(a[6]).map(x=>`<button onclick="alert('Workflow action logged: ${x}')">${x}</button>`).join("")}</div></td></tr>`).join("") : `<tr><td colspan="12" style="text-align:center;padding:42px;color:#64748b">No records found for today</td></tr>`}</tbody></table></div>
      <p class="muted" style="margin-top:12px">Showing ${rows.length ? 1 : 0}-${rows.length} of ${rows.length} records</p>`;
    }
    function actions(status){ return ({HUB:["Assign"], INBOX:["Incomplete","Insufficient","Reject","Submit"], PRE_APPROVED:["Approve"], APPROVED:["Ready"], READY_TO_ISSUE:["Complete"], INCOMPLETE:["Resubmit"], INSUFFICIENT:["Resubmit"]}[status] || []); }
    function newApplication(){
      return `<section class="hero"><h2>Create New Application</h2><p>Branch assisted intake with customer validation, card eligibility, account checks, and document readiness.</p></section>
      <div class="kpis"><div class="kpi accent-bank"><span>Document Rule</span><strong>277CC</strong></div><div class="kpi accent-mint"><span>Min Classic</span><strong>200K</strong></div><div class="kpi accent-warn"><span>Min Platinum</span><strong>2M</strong></div><div class="kpi accent-risk"><span>Max Limit</span><strong>5M</strong></div></div>
      <section class="panel metric"><h3>Personal Details</h3><p class="muted" style="margin-top:4px">CBS lookup will validate blacklist and dormant status before submission.</p><div class="form-grid" style="margin-top:16px">${["Applicant Name","NRC / Passport No.","Mobile Number","Email Address","Date of Birth","Application Channel"].map((x,i)=>`<label>${x}<input ${i===4?"type='date'":""} placeholder="${x}"></label>`).join("")}</div></section>
      <section class="panel metric" style="margin-top:16px"><h3>Card Application Information</h3><p class="muted" style="margin-top:4px">Account options are limited to active individual accounts with sufficient available balance.</p><div class="form-grid" style="margin-top:16px">${["Card Brand","Card Type","Credit Limit","Temporary Holding Account","Auto Debit Account","Pickup Location Code","Pickup Location Name"].map(x=>`<label>${x}<input placeholder="${x}"></label>`).join("")}</div></section>
      <div style="display:flex;justify-content:end;gap:10px;margin-top:16px"><button class="btn">Clear</button><button class="btn primary" onclick="alert('Application submitted to HUB')">Submit To HUB</button></div>`;
    }
    function report(title){
      const rows = apps.filter(a => a[11].startsWith(today));
      const userRows = [
        ["Super User", "SUPER", rows.filter(a=>a[5]==="SUPER").length, "Assign / Approve / Return", "2026-05-25 18:30"],
        ["Operator User", "OPERATOR", rows.filter(a=>a[5]==="OPERATOR").length, "Review / Submit / Reject", "2026-05-25 18:40"],
        ["Branch User", "BRANCH", rows.filter(a=>a[5]==="BRANCH").length, "Create / Ready / Complete", "2026-05-25 19:00"]
      ];
      return `<section class="hero"><h2>${title}</h2><p>Daily operational reporting with branch visibility, export support, and latest activity first.</p></section>
      <div class="kpis"><div class="kpi accent-bank"><span>Today Records</span><strong>${rows.length}</strong></div><div class="kpi accent-mint"><span>Approved</span><strong>${rows.filter(a=>a[6]==="APPROVED").length}</strong></div><div class="kpi accent-warn"><span>Pending</span><strong>${rows.filter(a=>["HUB","INBOX","PRE_APPROVED"].includes(a[6])).length}</strong></div><div class="kpi accent-risk"><span>Exceptions</span><strong>${rows.filter(a=>["INCOMPLETE","INSUFFICIENT","REJECTED"].includes(a[6])).length}</strong></div></div>
      <div class="toolbar"><div><h2>Report Criteria</h2><p class="muted">Default date range is current device date with latest records first.</p></div><button class="btn primary">Export Excel</button></div>
      <section class="panel metric"><div class="form-grid" style="grid-template-columns:repeat(5,1fr)"><input type="date"><input type="date"><input placeholder="${title.includes("User")?"User Role":"Status"}"><input placeholder="${title.includes("User")?"User Name":"Doc No / Name / NRC"}"><button class="btn">Search</button></div></section>
      <div class="table-wrap" style="margin-top:16px"><table><thead><tr>${(title.includes("User") ? ["No","User Name","Role","Processed Count","Action Summary","Last Process Date"] : ["No","Applied Date","Document No","Applicant Name","NRC","Status","Stage","Channel","Credit Limit"]).map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${title.includes("User")
        ? userRows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")
        : rows.map((a,i)=>`<tr><td>${i+1}</td><td>${a[11]}</td><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td><span class="badge ${a[6]}">${a[6].replaceAll("_"," ")}</span></td><td>${a[5]}</td><td>${a[8]}</td><td>${a[3].toLocaleString()} MMK</td></tr>`).join("")}
      </tbody></table></div>`;
    }
    function render(){
      document.getElementById("userName").textContent = state.role === "SUPER" ? "Super User" : state.role === "OPERATOR" ? "Operator User" : "Branch User";
      document.getElementById("userMeta").textContent = state.role === "BRANCH" ? "BRANCH - Branch 277" : state.role;
      renderNav();
      const app = document.getElementById("app");
      const label = state.page.split("-").map(x=>x[0].toUpperCase()+x.slice(1)).join(" ");
      if (state.page === "create-new-application") app.innerHTML = newApplication();
      else if (state.page === "daily-report") app.innerHTML = report("Daily Report");
      else if (state.page === "user-progress-report") app.innerHTML = report("User Progress Report");
      else app.innerHTML = queue(label);
    }
    document.getElementById("role").addEventListener("change", e => { state.role = e.target.value; state.page = firstPage[state.role]; render(); });
    render();
  </script>
</body>
</html>
